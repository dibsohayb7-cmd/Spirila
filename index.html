<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الأدوات المدرسية - Spirila</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
  :root {
    --primary: #1a1a1a;
    --secondary: #666;
    --bg: #f5f5f5;
    --card: #fff;
    --border: #e0e0e0;
    --danger: #dc3545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--primary); }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 700; }
  .nav-tabs { display: flex; gap: 8px; }
  .nav-tab { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px; }
  .nav-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .page { display: none; }
  .page.active { display: block; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .form-group { margin-bottom: 12px; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; }
  .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .product-img { width: 100%; height: 140px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .product-name { font-size: 15px; font-weight: 500; }
  .product-price { font-size: 18px; font-weight: 700; color: var(--primary); }
  .add-cart-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer; }
  .login-box { max-width: 400px; margin: 40px auto; padding: 24px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); text-align: center; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">📚 متجر الأدوات المدرسية</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('store')">🛒 المتجر</button>
      <button class="nav-tab" onclick="switchTab('admin')">⚙️ الإدارة</button>
    </div>
  </div>
</header>

<div class="container">
  <div id="store-page" class="page active">
    <h2>المنتجات المتاحة</h2>
    <div class="store-grid">
      <div class="product-card">
        <div class="product-img">📓</div>
        <div class="product-name">دفتر 96 صفحة</div>
        <div class="product-price">120 د.ج</div>
        <button class="add-cart-btn">أضف للسلة</button>
      </div>
      <div class="product-card">
        <div class="product-img">✒️</div>
        <div class="product-name">قلم حبر أزرق</div>
        <div class="product-price">35 د.ج</div>
        <button class="add-cart-btn">أضف للسلة</button>
      </div>
    </div>
  </div>

  <div id="admin-page" class="page">
    <div id="admin-login" class="login-box">
      <h3 style="margin-bottom: 12px;">قفل لوحة الإدارة 🔒</h3>
      <p style="font-size: 14px; color: var(--secondary); margin-bottom: 16px;">أدخل كلمة السر للوصول للتحكم:</p>
      <div class="form-group">
        <input type="password" id="admin-pass-input" placeholder="كلمة السر...">
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="checkAdminPassword()">دخول</button>
      <p id="login-error" style="color: var(--danger); font-size: 13px; margin-top: 8px; display: none;">كلمة السر خاطئة!</p>
    </div>

    <div id="admin-content" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2>لوحة التحكم بالمنتجات</h2>
        <button class="btn btn-danger btn-sm" onclick="logoutAdmin()">تسجيل الخروج</button>
      </div>
      <p>أهلاً بك في لوحة الإدارة المحمية!</p>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "DIB20091026"; 

  function switchTab(tab) {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

    if (tab === 'store') {
      document.querySelectorAll('.nav-tab')[0].classList.add('active');
      document.getElementById('store-page').classList.add('active');
    } else if (tab === 'admin') {
      document.querySelectorAll('.nav-tab')[1].classList.add('active');
      document.getElementById('admin-page').classList.add('active');
    }
  }

  function checkAdminPassword() {
    const input = document.getElementById('admin-pass-input').value;
    const errorMsg = document.getElementById('login-error');

    if (input === ADMIN_PASSWORD) {
      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      errorMsg.style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
    } else {
      errorMsg.style.display = 'block';
    }
  }

  function logoutAdmin() {
    document.getElementById('admin-login').style.display = 'block';
    document.getElementById('admin-content').style.display = 'none';
  }
</script>

</body>
</html>

// ========== PRODUCT CRUD ==========
function openProductModal(id) {
  document.getElementById('productModal').classList.add('show');
  if (id) {
    const p = products.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = '✏️ تعديل منتج';
    document.getElementById('editProductId').value = id;
    document.getElementById('prodName').value = p.name;
    document.getElementById('prodPrice').value = p.price;
    document.getElementById('prodStock').value = p.stock;
    document.getElementById('prodIcon').value = p.icon || '📦';
    document.getElementById('prodDesc').value = p.desc || '';
    document.getElementById('prodImage').value = p.image || '';
  } else {
    document.getElementById('modalTitle').textContent = '➕ إضافة منتج جديد';
    document.getElementById('editProductId').value = '';
    document.getElementById('prodName').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodStock').value = '50';
    document.getElementById('prodIcon').value = '📦';
    document.getElementById('prodDesc').value = '';
    document.getElementById('prodImage').value = '';
  }
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('show');
}

function saveProduct() {
  const id = document.getElementById('editProductId').value;
  const name = document.getElementById('prodName').value.trim();
  const price = parseFloat(document.getElementById('prodPrice').value);
  const stock = parseInt(document.getElementById('prodStock').value) || 0;
  const icon = document.getElementById('prodIcon').value.trim() || '📦';
  const desc = document.getElementById('prodDesc').value.trim();
  const image = document.getElementById('prodImage').value.trim();

  if (!name) { showToast('أدخل اسم المنتج'); return; }
  if (!price || price <= 0) { showToast('أدخل سعر صحيح'); return; }

  if (id) {
    const p = products.find(x => x.id == id);
    p.name = name; p.price = price; p.stock = stock; p.icon = icon; p.desc = desc; p.image = image;
    showToast('✅ تم التعديل');
  } else {
    products.push({ id: Date.now(), name, price, stock, icon, desc, image });
    showToast('✅ تمت الإضافة');
  }
  saveData();
  closeProductModal();
  renderAdmin();
  renderStore();
}

function editProduct(id) { openProductModal(id); }

function deleteProduct(id) {
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  products = products.filter(p => p.id !== id);
  saveData();
  renderAdmin();
  renderStore();
  showToast('🗑️ تم الحذف');
}

function updateOrderStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (o) { o.status = status; saveData(); renderAdmin(); showToast('📋 تم تحديث الحالة'); }
}

// ========== UTILS ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init
