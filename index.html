<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الأدوات المدرسية | سهل عملية اقتناء أدوات المدرسية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
  :root {
    --primary: #0f172a;
    --primary-light: #1e293b;
    --secondary: #64748b;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --purple: #8b5cf6;
    --purple-light: #ede9fe;
    --gradient: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--primary); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Header */
  header { background: var(--gradient); border-bottom: none; padding: 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(15,23,42,0.3); }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
  .logo span { font-size: 28px; }
  .nav-tabs { display: flex; gap: 10px; }
  .nav-tab { padding: 10px 20px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; transition: all 0.3s; backdrop-filter: blur(10px); }
  .nav-tab.active { background: #fff; color: var(--primary); border-color: #fff; box-shadow: 0 2px 12px rgba(255,255,255,0.2); }
  .nav-tab:hover:not(.active) { background: rgba(255,255,255,0.15); }

  /* Hero Section */
  .hero { background: var(--gradient); color: #fff; padding: 50px 20px; text-align: center; margin: -20px -20px 30px; border-radius: 0 0 30px 30px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 400px; height: 400px; background: rgba(59,130,246,0.1); border-radius: 50%; }
  .hero::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 300px; height: 300px; background: rgba(139,92,246,0.1); border-radius: 50%; }
  .hero h1 { font-size: 36px; font-weight: 900; margin-bottom: 12px; position: relative; z-index: 1; }
  .hero p { font-size: 18px; color: rgba(255,255,255,0.8); font-weight: 300; position: relative; z-index: 1; }
  .hero-badge { display: inline-block; background: var(--warning); color: var(--primary); padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; margin-top: 16px; position: relative; z-index: 1; }

  /* Pages */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Section Title */
  .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 4px; height: 28px; background: var(--accent); border-radius: 4px; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 24px; }
  .search-box { width: 100%; padding: 14px 20px 14px 50px; border: 2px solid var(--border); border-radius: 14px; font-family: inherit; font-size: 15px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.3s; }
  .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--secondary); }

  /* Offers / Discounts */
  .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .offer-card { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 20px; display: flex; gap: 16px; align-items: center; transition: all 0.3s; position: relative; overflow: hidden; }
  .offer-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); border-color: var(--accent); }
  .offer-card .offer-badge { position: absolute; top: 12px; left: 12px; background: var(--danger); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .offer-img { width: 80px; height: 80px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; overflow: hidden; }
  .offer-img img { width: 100%; height: 100%; object-fit: cover; }
  .offer-info { flex: 1; }
  .offer-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .offer-old-price { font-size: 14px; color: var(--secondary); text-decoration: line-through; }
  .offer-new-price { font-size: 22px; font-weight: 800; color: var(--danger); }
  .offer-btn { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .offer-btn:hover { opacity: 0.85; }

  /* Store */
  .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin: 24px 0; }
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: all 0.3s; position: relative; overflow: hidden; }
  .product-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); border-color: transparent; }
  .product-card .discount-tag { position: absolute; top: 12px; right: 12px; background: var(--danger); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; z-index: 2; }
  .product-img { width: 100%; height: 170px; border-radius: 12px; background: linear-gradient(135deg, #f1f5f9, #e2e8f0); display: flex; align-items: center; justify-content: center; font-size: 52px; overflow: hidden; }
  .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .product-card:hover .product-img img { transform: scale(1.05); }
  .product-name { font-size: 16px; font-weight: 700; }
  .product-desc { font-size: 13px; color: var(--secondary); line-height: 1.5; }
  .product-price-wrap { display: flex; align-items: baseline; gap: 8px; }
  .product-price { font-size: 20px; font-weight: 800; color: var(--primary); }
  .product-old-price { font-size: 14px; color: var(--secondary); text-decoration: line-through; }
  .product-stock { font-size: 12px; color: var(--secondary); display: flex; align-items: center; gap: 4px; }
